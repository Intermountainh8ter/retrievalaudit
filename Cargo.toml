[package]
name = "retrievalaudit"
version = "0.1.0"
authors = ["Intermountainh8ter"]
edition = "2021"
license = "MIT"
description = "Pre-registered RAG reproducibility auditor: pin the retriever + corpus + generator, score retrieval precision/recall@k and generator-vs-retrieved faithfulness with 95% bootstrap CIs."
repository = "https://github.com/Intermountainh8ter/retrievalaudit"
keywords = ["llm", "rag", "retrieval", "audit", "reproducibility"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
rand = "0.8"
rand_pcg = "0.3"

[[bin]]
name = "retrievalaudit"
path = "src/main.rs"

[lib]
name = "retrievalaudit"
path = "src/lib.rs"
